<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 짤 만들기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px;
    background: #f3f5f9; color: #172033;
    font-family: system-ui, sans-serif;
  }
  main {
    max-width: 700px; margin: auto; padding: 22px;
    background: white; border-radius: 20px;
  }
  h1 { margin: 0 0 8px; font-size: 25px; }
  p { color: #596579; line-height: 1.6; }
  label { display: block; margin-top: 18px; font-weight: 700; }
  textarea {
    width: 100%; margin-top: 8px; padding: 12px;
    border: 1px solid #ccd2dc; border-radius: 10px;
    font: inherit; font-size: 18px; resize: vertical;
  }
  input[type="range"] { width: 100%; margin-top: 12px; }
  input[type="file"] { max-width: 100%; margin-top: 10px; }
  canvas, #result {
    display: block; width: 100%; height: auto;
    margin-top: 20px; border-radius: 10px;
  }
  button {
    width: 100%; margin-top: 20px; padding: 15px;
    border: 0; border-radius: 12px;
    background: #3466ed; color: white;
    font-size: 17px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  #status { font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>나만의 짤 만들기</h1>
  <p>문구를 입력하고 완성된 이미지를 저장하세요.</p>

  <label for="message">넣을 문구</label>
  <textarea id="message" rows="2"
    maxlength="300">Test message!!!</textarea>

  <label for="size">글씨 크기</label>
  <input id="size" type="range" min="16" max="80" value="40">

  <label for="position">글씨 세로 위치</label>
  <input id="position" type="range" min="0" max="100" value="33">

  <label for="photo">배경 사진 바꾸기</label>
  <input id="photo" type="file" accept="image/*">

  <p id="status" role="status">배경 사진을 불러오는 중입니다.</p>
  <canvas id="canvas" hidden></canvas>

  <button id="save" disabled>PNG 이미지 만들기 · 다운로드</button>

  <section id="output" hidden>
    <p>아이폰에서 다운로드가 안 되면 아래 이미지를 길게 눌러
      ‘사진에 저장’을 선택하세요.</p>
    <img id="result" alt="입력한 문구가 들어간 완성 이미지">
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");
let background = null;
let loadVersion = 0;

// 긴 문구는 이미지 너비에 맞춰 줄을 바꿉니다.
function wrapText(text, maxWidth) {
  const lines = [];
  for (const paragraph of text.split("\n")) {
    let line = "";
    for (const char of Array.from(paragraph)) {
      if (line && ctx.measureText(line + char).width > maxWidth) {
        lines.push(line);
        line = char;
      } else {
        line += char;
      }
    }
    lines.push(line);
  }
  return lines;
}

function draw() {
  if (!background) return;
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(background, 0, 0, w, h);

  // 첨부 예시의 660px 너비를 기준으로 크기와 여백을 조절합니다.
  const scale = w / 660;
  const margin = 15 * scale;
  let fontSize = Number($("size").value) * scale;
  let lines, lineHeight, outline;

  // 문구가 많으면 글씨를 줄여 이미지 밖으로 넘치지 않게 합니다.
  for (let i = 0; i < 100; i++) {
    ctx.font = `900 ${fontSize}px system-ui, sans-serif`;
    lines = wrapText($("message").value, w - margin * 2);
    lineHeight = fontSize * 1.25;
    outline = fontSize * 0.2;
    if (lines.length * lineHeight + outline <= h - margin * 2) break;
    fontSize *= 0.9;
  }

  const textHeight = lines.length * lineHeight;
  const topMin = margin + outline / 2;
  const topMax = Math.max(topMin, h - margin - textHeight - outline / 2);
  const requestedTop = h * Number($("position").value) / 100;
  const top = Math.max(topMin, Math.min(requestedTop, topMax));

  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.lineJoin = "round";
  ctx.miterLimit = 2;
  ctx.lineWidth = outline;
  ctx.strokeStyle = "#fff";
  ctx.fillStyle = "#000";

  lines.forEach((line, index) => {
    const y = top + index * lineHeight;
    ctx.strokeText(line, margin, y);
    ctx.fillText(line, margin, y);
  });

  // 文句を変えた後に古い保存画像が残らないようにします。
  $("output").hidden = true;
}

function loadImage(src, temporary = false) {
  const version = ++loadVersion;
  const img = new Image();
  $("status").textContent = "写真を読み込んでいます…";

  img.onload = () => {
    if (temporary) URL.revokeObjectURL(src);
    if (version !== loadVersion) return;
    background = img;

    // 大きな写真は長辺2000pxまでにしてメモリ使用量を抑えます。
    const ratio = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    canvas.width = Math.max(1, Math.round(img.naturalWidth * ratio));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * ratio));
    canvas.hidden = false;
    $("save").disabled = false;
    $("status").textContent = "文구を入力するとプレビューに反映されます。";
    draw();
  };

  img.onerror = () => {
    if (temporary) URL.revokeObjectURL(src);
    if (version !== loadVersion) return;
    $("status").textContent =
      "사진을 불러오지 못했습니다. ‘배경 사진 바꾸기’에서 JPG 또는 PNG 사진을 선택하세요.";
  };
  img.src = src;
}

["message", "size", "position"].forEach(id => {
  $(id).addEventListener("input", draw);
});

$("photo").addEventListener("change", event => {
  const file = event.target.files[0];
  if (file) loadImage(URL.createObjectURL(file), true);
});

$("save").addEventListener("click", () => {
  if (!background) return;
  const url = canvas.toDataURL("image/png");
  $("result").src = url;
  $("output").hidden = false;

  const link = document.createElement("a");
  link.href = url;
  link.download = `my-image-${Date.now()}.png`;
  document.body.appendChild(link);
